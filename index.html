<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Aleksandra 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#f6efe6;color:#4a1a24;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{width:min(92vw,420px);background:#fffaf4;border:1px solid #e8d8c6;border-radius:26px;padding:34px 26px;text-align:center;box-shadow:0 20px 50px #7a2a3a22;position:relative}
h1{font-family:'Cormorant Garamond',serif;font-size:34px;line-height:1.15;color:#6b1d2e;margin-bottom:10px}
p{color:#8a5a62;font-size:15px;line-height:1.5;margin-bottom:22px}
.step{display:none;animation:in .6s ease}.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
.btn{border:none;border-radius:40px;padding:14px 30px;font:600 16px Inter;cursor:pointer;transition:.2s}
.yes{background:#6b1d2e;color:#fff}
.no{background:#efe3d6;color:#6b1d2e;position:relative}
.row{display:flex;gap:12px;justify-content:center;align-items:center;min-height:60px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.opt{background:#f7ede2;border:1.5px solid transparent;border-radius:16px;padding:14px 8px;font-size:15px;cursor:pointer;color:#4a1a24}
.opt.sel{border-color:#6b1d2e;background:#f1dcd8}
.heart{font-size:48px;margin-bottom:8px;animation:b 1.4s infinite}@keyframes b{50%{transform:scale(1.15)}}
.letter{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:#5a1a28;text-align:left;background:#fbf3ea;border-radius:16px;padding:20px;margin-bottom:20px;line-height:1.5}
.sum{font-size:14px;color:#6b1d2e;background:#f1dcd8;border-radius:14px;padding:12px;margin-bottom:18px}
.lang{position:absolute;top:14px;right:16px;font-size:12px;color:#a07a80;cursor:pointer}
.f{position:fixed;pointer-events:none;animation:up 4s linear forwards}@keyframes up{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}
</style></head><body>
<audio id="mus" src="music.mp3" loop preload="auto"></audio>
<div id="snd" onclick="mute()" style="position:fixed;bottom:18px;right:18px;width:44px;height:44px;border-radius:50%;background:#6b1d2e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:9">🎵</div>
<div class="card">
<div class="lang" onclick="toggle()">RU / UZ</div>
<div class="step on" id="s0"><div class="heart">💌</div><h1 data-t="q"></h1><p data-t="qs"></p>
<div class="row"><button class="btn yes" id="yes" onclick="go(1)" data-t="yes"></button><button class="btn no" id="no">Нет</button></div></div>
<div class="step" id="s1"><h1 data-t="dq"></h1><p data-t="ds"></p><div class="grid" id="days"></div><button class="btn yes" onclick="need('day',2)" data-t="next"></button></div>
<div class="step" id="s2"><h1 data-t="tq"></h1><p></p><div class="grid" id="times"></div><button class="btn yes" onclick="need('time',3)" data-t="next"></button></div>
<div class="step" id="s3"><h1 data-t="pq"></h1><p data-t="ps"></p><div class="grid" id="plans"></div><button class="btn yes" onclick="need('plan',4)" data-t="next"></button></div>
<div class="step" id="s4"><h1 data-t="lt"></h1><div class="letter" data-t="letter"></div><div class="sum" id="sum"></div><button class="btn yes" onclick="send()" data-t="send"></button></div>
</div>
<script>
const T={ru:{q:"Александра, встретимся?",qs:"У меня есть маленький вопрос… и только один правильный ответ 🙂",yes:"Да 💕",dq:"Ура! Какой день тебе удобен?",ds:"Выбирай любой — я подстроюсь",tq:"А во сколько?",pq:"Что будем делать?",ps:"Выбери, остальное — сюрприз",next:"Дальше →",lt:"Маленькое письмо для нас",letter:"Александра,<br>спасибо, что сказала «да». Я давно хотел пригласить тебя, но всё ждал подходящего момента. Обещаю, этот вечер будет тёплым и запомнится нам обоим.<br><br>— Джамшид",send:"Отправить ответ Джамшиду 💌",days:["Сегодня","Завтра","Суббота","Воскресенье"],times:["12:00","15:00","18:00","20:00"],plans:["☕ Кофе","🍝 Ужин","🌳 Прогулка","🎬 Кино"],nos:["Нет","Точно?","Подумай ещё 🥺","Уверена?","Ну пожалуйста…"],hints:["У меня есть маленький вопрос… и только один правильный ответ 🙂","Кстати, кофе за мой счёт ☕","Говорят, лучшие истории начинаются с «да» ✨","Я уже улыбаюсь, представляя этот вечер 🙂","Кнопка «да» тоже скучает по тебе 💕","Ладно, я понял — ты имела в виду «да» 😉"],msg:"Я согласна! 💕"},
uz:{q:"Aleksandra, uchrashamizmi?",qs:"Sizga kichkina savolim bor… javobi esa bitta 🙂",yes:"Ha 💕",dq:"Zo'r! Qaysi kun qulay?",ds:"Istaganini tanlang",tq:"Soat nechada?",pq:"Nima qilamiz?",ps:"Tanlang, qolgani — syurpriz",next:"Keyingi →",lt:"Biz uchun kichkina xat",letter:"Aleksandra,<br>«ha» deganingiz uchun rahmat. Sizni anchadan beri taklif qilmoqchi edim. Bu oqshom ikkalamizning ham yodimizda qoladi, va'da beraman.<br><br>— Jamshid",send:"Javobni Jamshidga yuborish 💌",days:["Bugun","Ertaga","Shanba","Yakshanba"],times:["12:00","15:00","18:00","20:00"],plans:["☕ Qahva","🍝 Kechki ovqat","🌳 Sayr","🎬 Kino"],nos:["Yo'q","Aniqmi?","Yana o'ylang 🥺","Ishonchingiz komilmi?","Iltimos…"],hints:["Sizga kichkina savolim bor… javobi esa bitta 🙂","Aytgancha, qahva mendan ☕","Eng yaxshi hikoyalar «ha» bilan boshlanadi ✨","Bu oqshomni o'ylab, hozirdan jilmayyapman 🙂","«Ha» tugmasi ham sizni kutyapti 💕","Mayli, tushundim — siz «ha» demoqchi edingiz 😉"],msg:"Roziman! 💕"}};
let L="ru",S={},n=0;
function draw(){const t=T[L];document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=t[e.dataset.t]);
[["days","day"],["times","time"],["plans","plan"]].forEach(([g,k])=>{const el=document.getElementById(g);el.innerHTML="";t[g].forEach((v,i)=>{const b=document.createElement('div');b.className='opt'+(S[k]===i?' sel':'');b.textContent=v;b.onclick=()=>{S[k]=i;draw()};el.appendChild(b)})});
if(S.plan!=null)document.getElementById('sum').innerHTML=`📅 ${t.days[S.day]} · 🕒 ${t.times[S.time]} · ${t.plans[S.plan]}`;
const q=document.querySelector('[data-t=qs]');if(q)q.innerHTML=t.hints[Math.min(n,t.hints.length-1)];document.getElementById('no').textContent=n>=5?t.yes:t.nos[n%t.nos.length]}
function toggle(){L=L=="ru"?"uz":"ru";draw()}
function go(i){document.querySelectorAll('.step').forEach(s=>s.classList.remove('on'));document.getElementById('s'+i).classList.add('on');if(i==1||i==4)hearts();draw()}
function need(k,i){if(S[k]==null){document.getElementById('s'+(i-1)).animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:250});return}go(i)}
const no=document.getElementById('no');let lt=0;function run(e){if(n>=5){go(1);return}e.preventDefault();const now=Date.now();if(now-lt<350)return;lt=now;n++;draw();const k=1-n*.13;no.style.transition='all .35s ease';no.style.transform=`translate(${(Math.random()-.5)*160}px,${(Math.random()-.5)*120}px) scale(${k})`;no.style.opacity=Math.max(.35,1-n*.13);if(n>=5){no.style.transform='none';no.style.opacity=1;no.style.background='#6b1d2e';no.style.color='#fff'}const y=document.getElementById('yes');y.style.transition='all .4s ease';y.style.transform=`scale(${1+Math.min(n,5)*.1})`;y.style.boxShadow=`0 0 ${n*6}px rgba(107,29,46,${.15+n*.08})`}
no.addEventListener('mouseenter',e=>{if(n<5)run(e)});no.addEventListener('touchstart',run,{passive:false});no.addEventListener('click',run);
function hearts(){for(let i=0;i<18;i++){const h=document.createElement('div');h.className='f';h.textContent=['💕','❤️','🌸','✨'][i%4];h.style.left=Math.random()*100+'vw';h.style.top='100vh';h.style.fontSize=(16+Math.random()*20)+'px';h.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),6000)}}
function send(){try{navigator.clipboard.writeText(T[L].msg)}catch(e){};const t=T[L];const txt=`${t.msg}\n📅 ${t.days[S.day]}\n🕒 ${t.times[S.time]}\n${t.plans[S.plan]}`;hearts();setTimeout(()=>location.href='https://t.me/ubaskin?text='+encodeURIComponent(txt),900)}
const mus=document.getElementById('mus');mus.volume=.55;let started=0;
function startM(){if(!started){mus.play().then(()=>started=1).catch(()=>{})}}
['touchstart','click','mousemove'].forEach(e=>document.addEventListener(e,startM,{passive:true}));
function mute(){mus.muted=!mus.muted;document.getElementById('snd').textContent=mus.muted?'🔇':'🎵';startM()}
mus.play().then(()=>started=1).catch(()=>{});
draw();
</script></body></html>
